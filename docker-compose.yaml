version: '3.8'

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true # Allows raw USB/serial device handling
    environment:
      - TZ=UTC
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro # Enables Bluetooth discovery on the host
    devices:
      # Pass through your Zigbee USB Dongle (Update device path if needed, e.g., /dev/ttyACM0 or /dev/ttyUSB0)
      - /dev/ttyUSB0:/dev/ttyUSB0

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./matter-data:/data
      - /run/dbus:/run/dbus:ro # Enables Matter commissioning via host Bluetooth
