version: '3.8'

volumes:
  jenkins_home:

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token YOUR_COPIED_TOKEN_HERE
    network_mode: host
    
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true # Allows raw USB/serial device handling
    environment:
      - TZ=UTC
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro # Enables Bluetooth discovery on the host
    devices:
      # Pass through your Zigbee USB Dongle (Update device path if needed, e.g., /dev/ttyACM0 or /dev/ttyUSB0)
      - /dev/ttyUSB0:/dev/ttyUSB0

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./matter-data:/data
      - /run/dbus:/run/dbus:ro # Enables Matter commissioning via host Bluetooth

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    network_mode: host
    volumes:
      - jenkins_home:/var/jenkins_home

  jenkins-agent:
    image: jenkins/inbound-agent:latest
    container_name: jenkins-agent
    restart: unless-stopped
    network_mode: host
    depends_on:
      - jenkins
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - -url
      - http://localhost:8080
      - -secret
      - ${JENKINS_AGENT_SECRET:?Set JENKINS_AGENT_SECRET in your environment}
      - -name
      - docker-agent
